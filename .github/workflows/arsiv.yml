name: nesine-arsiv
on:
  schedule:
    - cron: "*/15 * * * *"     # oran hareketi arsivi -- kacan oran geri gelmez
    # NOT: */15 PUBLIC repo icin (Actions dakikasi sinirsiz). Repo private
    # yapilirsa ~2000 dk/ay kotasi asilir -> */30 e dusurulmeli.
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: nesine-arsiv
  cancel-in-progress: false
jobs:
  arsiv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - name: Snapshot
        working-directory: src
        run: python bulletin.py
      - name: Oz-denetim
        working-directory: src
        continue-on-error: true
        env:
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
        run: python verify.py
      - name: Commit
        run: |
          git config user.name  "nesine-bot"
          git config user.email "bot@local"
          # GIT'E JSON BIRLESTIRMESI YAPTIRMA.
          # Iki is (arsiv 15 dk'da bir, istatistik gunluk) AYNI buyuk JSON
          # dosyalarini yeniden yaziyor. `--autostash` geri uygularken
          # cakisiyordu, `|| true` hatayi yutuyordu ve `git add data/`
          # CAKISMA ISARETLI dosyayi commit ediyordu. Bot butun mac-oncesi
          # modellerini kaybetti; bir kez onarildi, TEKRAR OLUSTU.
          # Artik: uzaktakini ANLAMSAL birlestir, sonra commit et.
          for i in 1 2 3; do
            git fetch origin main || { sleep $((i * 5)); continue; }
            # 1) uzaktakini ANLAMSAL birlestir (git metin birlestirmesi YOK)
            python3 src/veri_birlestir.py
            # 2) urettigimiz veriyi kenara al, uzagin TAM USTUNE gec, geri koy.
            #    Boylece commit'imiz her zaman origin/main'in DOGRUDAN cocugu
            #    olur -> push daima fast-forward, rebase/cakisma IMKANSIZ.
            #    Izlenmeyen dosyalar (yeni arsiv .gz) reset'ten etkilenmez.
            rm -rf /tmp/veri_yedek && mkdir -p /tmp/veri_yedek
            cp -R data/. /tmp/veri_yedek/
            git reset -q --hard origin/main
            cp -R /tmp/veri_yedek/. data/
            if ! python3 src/veri_kontrol.py; then
              echo "VERI BOZUK — commit iptal"; exit 1
            fi
            git add data/
            git diff --staged --quiet && echo "degisiklik yok" && break
            git commit -m "arsiv: $(date -u +%FT%TZ)"
            if git push; then echo "push tamam ($i. deneme)"; break; fi
            if [ "$i" = "3" ]; then echo "3 denemede push edilemedi"; exit 1; fi
            sleep $((i * 5))
          done
