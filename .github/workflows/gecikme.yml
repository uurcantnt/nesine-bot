name: nesine-gecikme-olcum
on:
  workflow_dispatch:
    inputs:
      dakika:
        description: "Kac dakika olculsun"
        required: false
        default: "30"
jobs:
  olc:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - run: pip install -q sports-skills
      - name: ESPN vs Nesine gecikme
        working-directory: src
        run: python gecikme_olc.py ${{ github.event.inputs.dakika || 30 }}
