name: nesine-gunluk
on:
  schedule:
    - cron: "0 9 * * *"        # 12:00 TR -- gunluk oneri
  workflow_dispatch:
    inputs:
      bacak:
        description: "Kupon bacak sayisi (1-3)"
        required: false
        default: "1"
permissions:
  contents: write
concurrency:
  group: nesine-gunluk
jobs:
  oneri:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - name: Oneri gonder
        working-directory: src
        env:
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
        run: python daily.py ${{ github.event.inputs.bacak || 1 }}
      - name: Commit
        run: |
          git config user.name  "nesine-bot"
          git config user.email "bot@local"
          # PUSH YARISI: arsiv isi 15 dk'da bir data/'ya push ediyor.
          # Tek denemede non-fast-forward alinca yazi KAYBOLUYOR.
          # 3 deneme, her denemede yeniden pull; son denemede GERCEKTEN
          # basarisiz ol (sessiz kayip, gorunur hatadan kotudur).
          for i in 1 2 3; do
            git pull --rebase --autostash origin main || true
            git add data/
            git diff --staged --quiet && echo "degisiklik yok" && break
            git commit -m "gunluk: $(date -u +%FT%TZ)" || true
            if git push; then echo "push tamam ($i. deneme)"; break; fi
            if [ "$i" = "3" ]; then echo "3 denemede push edilemedi"; exit 1; fi
            sleep $((i * 5))
          done
