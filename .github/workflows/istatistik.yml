name: nesine-istatistik
on:
  schedule:
    - cron: "20 5 * * *"     # her gun 08:20 TR
  workflow_dispatch:
    inputs:
      limit:
        description: "Kac takim islensin"
        required: false
        default: "1200"
permissions:
  contents: write
concurrency: { group: nesine-istatistik }
jobs:
  topla:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - run: pip install -q sports-skills
      - name: Istatistik topla
        working-directory: src
        run: python istatistik_topla.py ${{ github.event.inputs.limit || 1200 }}
      - name: Commit
        run: |
          git config user.name  "nesine-bot"
          git config user.email "bot@local"
          # PUSH YARISI: arsiv isi 15 dk'da bir data/'ya push ediyor.
          # Tek denemede non-fast-forward alinca yazi KAYBOLUYOR.
          # 3 deneme, her denemede yeniden pull; son denemede GERCEKTEN
          # basarisiz ol (sessiz kayip, gorunur hatadan kotudur).
          for i in 1 2 3; do
            git pull --rebase --autostash origin main || true
            git add data/
            git diff --staged --quiet && echo "degisiklik yok" && break
            git commit -m "istatistik: $(date -u +%FT%TZ)" || true
            if git push; then echo "push tamam ($i. deneme)"; break; fi
            if [ "$i" = "3" ]; then echo "3 denemede push edilemedi"; exit 1; fi
            sleep $((i * 5))
          done
