name: nesine-kapsama-olcum
on:
  workflow_dispatch:
jobs:
  olc:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - name: sports-skills kur
        run: pip install -q sports-skills
      - name: Nesine maclarinin kaci ESPN'de bulunuyor
        working-directory: src
        run: python kapsama_olc.py
