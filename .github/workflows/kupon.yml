name: nesine-kupon
on:
  workflow_dispatch:
    inputs:
      canli:
        description: "Canli maclar dahil edilsin mi (1/0)"
        required: false
        default: "1"
      filtre:
        description: "iy | au | oran2 | iki | korner | kart (bos = suzgec yok)"
        required: false
        default: ""
      zorla:
        description: "Hacim sinirini BILEREK gec (1/0). Gecildigi mesaja yazilir."
        required: false
        default: "0"
permissions:
  contents: write
concurrency: { group: nesine-kupon }
jobs:
  kupon:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - name: Uc seviyeli kupon uret ve gonder
        working-directory: src
        env:
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
        run: |
          ARGS=""
          [ "${{ github.event.inputs.canli || '1' }}" = "0" ] && ARGS="$ARGS --canlisiz"
          F="${{ github.event.inputs.filtre }}"
          [ -n "$F" ] && ARGS="$ARGS --filtre=$F"
          [ "${{ github.event.inputs.zorla || '0' }}" = "1" ] && ARGS="$ARGS --zorla"
          echo "args:$ARGS"
          python tiers.py $ARGS
      # HACIM DEFTERI: kaydedilmezse sayac her kosuda sifirlanir ve
      # "gunde 2 kupon" siniri hicbir zaman devreye girmez.
      - name: Hacim defteri + GOLGE KAYDINI kaydet
        if: always()
        run: |
          git config user.name  "nesine-bot"
          git config user.email "bot@local"
          # PUSH YARISI: arsiv isi 15 dk'da bir data/'ya push ediyor.
          # Tek denemede non-fast-forward alinca yazi KAYBOLUYOR.
          # 3 deneme, her denemede yeniden pull; son denemede GERCEKTEN
          # basarisiz ol (sessiz kayip, gorunur hatadan kotudur).
          for i in 1 2 3; do
            # ÇAKISMA GUVENLIGI: `|| true` ile yutulan basarisiz bir rebase,
            # calisma agacinda GIT CAKISMA ISARETLERI birakiyordu; ardindan
            # `git add data/` onlari sahneleyip COMMIT EDIYORDU.
            # 2026-08-22'de tam olarak bu oldu: eslesme.json, istatistik.json
            # ve referans.json bozuldu, bot butun mac-oncesi modelleri
            # kaybetti (Premier Lig maci bile "veri yok" dedi).
            # Artik basarisiz rebase GERI ALINIR ve tekrar denenir.
            if ! git pull --rebase --autostash origin main; then
              echo "pull/rebase basarisiz — geri aliniyor"
              git rebase --abort 2>/dev/null || true
              git checkout -- data/ 2>/dev/null || true
              sleep $((i * 5)); continue
            fi
            # SON SAVUNMA: bozuk veri commit edilmesin. Isi kirmizi yapmak,
            # sessizce bozuk veri yaymaktan yeglenir.
            if ! python3 src/veri_kontrol.py; then
              echo "VERI BOZUK — commit iptal"; exit 1
            fi
            git add data/
            git diff --staged --quiet && echo "degisiklik yok" && break
            git commit -m "hacim + golge: $(date -u +%FT%TZ)" || true
            if git push; then echo "push tamam ($i. deneme)"; break; fi
            if [ "$i" = "3" ]; then echo "3 denemede push edilemedi"; exit 1; fi
            sleep $((i * 5))
          done
