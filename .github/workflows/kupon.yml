name: nesine-kupon
on:
  workflow_dispatch:
    inputs:
      canli:
        description: "Canli maclar dahil edilsin mi (1/0)"
        required: false
        default: "1"
      filtre:
        description: "iy | au | oran2 | iki | korner | kart (bos = suzgec yok)"
        required: false
        default: ""
jobs:
  kupon:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - name: Uc seviyeli kupon uret ve gonder
        working-directory: src
        env:
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
        run: |
          ARGS=""
          [ "${{ github.event.inputs.canli || '1' }}" = "0" ] && ARGS="$ARGS --canlisiz"
          F="${{ github.event.inputs.filtre }}"
          [ -n "$F" ] && ARGS="$ARGS --filtre=$F"
          echo "args:$ARGS"
          python tiers.py $ARGS
