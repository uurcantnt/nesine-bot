name: nesine-lig-test
on: { workflow_dispatch: {} }
jobs:
  t:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - run: pip install -q sports-skills
      - name: Kac lig var
        run: |
          sports-skills football get_competitions 2>&1 | python3 -c "
import sys,json
d=json.load(sys.stdin)
c=(d.get('data') or {}).get('competitions') or (d.get('data') or {}).get('results') or []
print('lig sayisi:', len(c))
for x in c[:40]:
    print('  ', x.get('id') or x.get('slug'), '|', x.get('name') or x.get('displayName'))
"
