name: nesine-veri-tani
on:
  workflow_dispatch:
jobs:
  tani:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - name: Veri kaynaklari erisilebilir mi
        run: |
          probe () {
            printf "%-42s " "$1"
            curl -s -o /tmp/o -w '%{http_code} %{size_download}b %{time_total}s\n' -m 25 \
              -H 'User-Agent: Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/126' "$2" || echo "HATA"
          }
          probe "espn scoreboard tur.1"   "https://site.api.espn.com/apis/site/v2/sports/soccer/tur.1/scoreboard"
          probe "espn site.web.api teams" "https://site.web.api.espn.com/apis/site/v2/sports/soccer/tur.1/teams"
          probe "espn core api"           "https://sports.core.api.espn.com/v2/sports/soccer/leagues/tur.1"
          probe "understat EPL"           "https://understat.com/league/EPL"
          probe "fbref"                   "https://fbref.com/en/comps/9/Premier-League-Stats"
          probe "thesportsdb"             "https://www.thesportsdb.com/api/v1/json/3/eventspastleague.php?id=4328"
          probe "football-data.org"       "https://api.football-data.org/v4/competitions"
          probe "transfermarkt"           "https://www.transfermarkt.com"
          echo "--- ikinci fiyat kaynagi (fd) ---"
          probe "fd fixtures"             "https://www.football-data.co.uk/fixtures.csv"
          probe "fd new_league_fixtures"  "https://www.football-data.co.uk/new_league_fixtures.csv"
          probe "fd sezon E0 2627"        "https://www.football-data.co.uk/mmz4281/2627/E0.csv"
          probe "fd ek lig ARG"           "https://www.football-data.co.uk/new/ARG.csv"
      - name: Ikinci fiyat MODULU calisiyor mu
        run: |
          python3 - <<'PY'
          import sys; sys.path.insert(0, "src")
          import fd
          ix = fd._indeks()
          print(f"fd fikstur indeksi: {len(ix)} mac")
          r = fd.ikinci("Atalanta", "Bologna")
          print("ornek sorgu:", {k: v for k, v in r.items() if k != "ms"})
          import bulletin
          ol = [e for e in bulletin.latest().get("olay", []) if e.get("ts")]
          k = fd.kapsama(ol)
          print(f"KAPSAMA: {k['var']}/{k['toplam']} mac "
                f"(%{100*k['var']/max(k['toplam'],1):.0f})")
          for n, c in sorted(k["nedenler"].items(), key=lambda z: -z[1]):
              print(f"   {c:>4}  {n}")
          print("BAYATLIK (0 = taze):", round(fd._YAS))
          PY
      - name: sports-skills CLI calisiyor mu
        run: |
          pip install -q sports-skills
          echo "--- search_team ---"
          timeout 90 sports-skills football search_team --query="Galatasaray" 2>&1 | head -20 || echo "TIMEOUT/HATA"
          echo "--- get_competitions ---"
          timeout 90 sports-skills football get_competitions 2>&1 | head -14 || echo "TIMEOUT/HATA"
