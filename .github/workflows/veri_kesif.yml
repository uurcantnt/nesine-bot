name: nesine-veri-kesif
on: { workflow_dispatch: {} }
jobs:
  kesif:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - run: pip install -q sports-skills
      - name: Canli skor ve dakika var mi
        run: |
          python3 - <<'PY'
          from sports_skills import football
          import json, datetime
          d = football.get_daily_schedule()
          ev = ((d or {}).get("data") or {}).get("events") or []
          print("bugunku mac:", len(ev))
          durum = {}
          for e in ev:
              durum[e.get("status")] = durum.get(e.get("status"), 0) + 1
          print("durumlar:", durum)
          canli = [e for e in ev if e.get("status") not in ("closed", "not_started")]
          print("\ncanli/devam eden:", len(canli))
          for e in canli[:3]:
              print(json.dumps(e, ensure_ascii=False)[:900])
              print("---")
          if not canli:
              print("\n(su an canli mac yok — ornek olarak bir 'closed' macin alanlari:)")
              if ev: print(json.dumps(ev[0], ensure_ascii=False)[:700])
          PY
