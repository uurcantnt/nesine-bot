name: nesine-veri-kesif
on: { workflow_dispatch: {} }
jobs:
  kesif:
    runs-on: ubuntu-latest
    steps:
      - name: Sofascore runnerdan erisilebiliyor mu
        run: |
          UA='Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/126.0 Safari/537.36'
          p () { printf "%-46s " "$1"; curl -s -o /tmp/o.bin -w '%{http_code} %{size_download}b\n' -m 20 \
                   --compressed -H "User-Agent: $UA" -H 'Accept: application/json' "$2"; }
          p "sofascore canli"      "https://api.sofascore.com/api/v1/sport/football/events/live"
          echo "--- ilk 300 bayt ---"; head -c 300 /tmp/o.bin; echo
          python3 - <<'PY'
          import json, urllib.request
          UA="Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/126.0 Safari/537.36"
          def get(u):
              r=urllib.request.Request(u, headers={"User-Agent":UA,"Accept":"application/json"})
              return json.loads(urllib.request.urlopen(r, timeout=20).read().decode())
          try:
              d=get("https://api.sofascore.com/api/v1/sport/football/events/live")
          except Exception as e:
              print("canli liste HATA:", e); raise SystemExit
          ev=d.get("events") or []
          print(f"\nCANLI MAC: {len(ev)}")
          for e in ev[:6]:
              h=(e.get("homeTeam") or {}).get("name"); a=(e.get("awayTeam") or {}).get("name")
              hs=(e.get("homeScore") or {}).get("current"); as_=(e.get("awayScore") or {}).get("current")
              tt=(e.get("tournament") or {}).get("name")
              print(f"  {str(h)[:22]:<22} {hs}-{as_} {str(a)[:22]:<22} · {str(tt)[:28]}")
          if ev:
              eid=ev[0]["id"]
              print(f"\nistatistik denemesi (event {eid}):")
              try:
                  s=get(f"https://api.sofascore.com/api/v1/event/{eid}/statistics")
                  gruplar=(s.get("statistics") or [])
                  for g in gruplar[:1]:
                      for grp in (g.get("groups") or []):
                          for it in (grp.get("statisticsItems") or []):
                              if any(k in str(it.get("name","")).lower() for k in ("corner","card","shot")):
                                  print(f"   {it.get('name'):<28} ev={it.get('home')} dep={it.get('away')}")
              except Exception as e:
                  print("   istatistik HATA:", e)
          PY
