name: nesine-veri-kesif
on: { workflow_dispatch: {} }
jobs:
  kesif:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - run: pip install -q sports-skills
      - name: CANLI macta istatistik geliyor mu
        run: |
          python3 - <<'PY'
          from sports_skills import football
          import json, datetime
          tum=[]
          bugun=datetime.datetime.now(datetime.timezone.utc)
          for t in (None,
                    bugun.strftime("%Y%m%d"),
                    (bugun-datetime.timedelta(days=1)).strftime("%Y%m%d")):
              d=football.get_daily_schedule(**({"date":t} if t else {}))
              tum += ((d or {}).get("data") or {}).get("events") or []
          canli=[e for e in tum if e.get("status")=="live"]
          print(f"toplam {len(tum)} mac · CANLI {len(canli)}")
          if not canli:
              print("su an canli mac yok — bitmis bir macla kiyas icin deneme:")
              canli=[e for e in tum if e.get("status")=="closed"][:1]
          for e in canli[:3]:
              c=e.get("competitors") or []
              ad=" - ".join((x.get("team") or {}).get("name","?") for x in c)
              print(f"\n══ {ad}  [{e.get('status')}]  skor {e.get('scores')}")
              st=football.get_event_statistics(event_id=str(e["id"]))
              tt=((st or {}).get("data") or {}).get("teams") or []
              if not tt:
                  print("   ❌ istatistik BOS:", json.dumps(st, ensure_ascii=False)[:200])
                  continue
              for x in tt:
                  s=x.get("statistics") or {}
                  print(f"   {(x.get('team') or {}).get('name','?')[:20]:<20} "
                        f"korner={s.get('corner_kicks')} sari={s.get('yellow_cards')} "
                        f"sut={s.get('shots_on_target')} topla={s.get('ball_possession')}")
          PY
