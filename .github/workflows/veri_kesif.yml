name: nesine-veri-kesif
on: { workflow_dispatch: {} }
jobs:
  kesif:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - run: pip install -q sports-skills
      - name: DraftKings oranlari ve dakika alani
        run: |
          python3 - <<'PY'
          from sports_skills import football
          import json
          tum=[]
          for t in ("20260821","20260822"):
              d=football.get_daily_schedule(date=t)
              ev=((d or {}).get("data") or {}).get("events") or []
              tum += ev
              print(f"{t}: {len(ev)} mac")
          oranli=[e for e in tum if e.get("odds")]
          print(f"\nTOPLAM {len(tum)} mac · ORAN ICEREN {len(oranli)} (%{100*len(oranli)/max(1,len(tum)):.0f})")
          if oranli:
              e=oranli[0]
              print("\n--- ornek odds blogu ---")
              print(json.dumps(e.get("odds"), ensure_ascii=False)[:700])
              print("\n--- saglayicilar ---")
              import collections
              print(collections.Counter((x.get("odds") or {}).get("provider") for x in oranli))
              print("\n--- moneyline dolu olan ---")
              ml=[x for x in oranli if (x.get("odds") or {}).get("moneyline",{}).get("home")]
              print(f"  {len(ml)} macta moneyline var")
              for x in ml[:5]:
                  c=x["competitors"]; o=x["odds"]["moneyline"]
                  print(f"   {c[0]['team']['name'][:18]:<18} - {c[1]['team']['name'][:18]:<18} "
                        f"H={o.get('home')} D={o.get('draw')} A={o.get('away')}")
          print("\n--- dakika/clock alani var mi (tum anahtarlar) ---")
          if tum: print(sorted(tum[0].keys()))
          PY
