name: nesine-veri-kesif
on: { workflow_dispatch: {} }
jobs:
  kesif:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - run: pip install -q sports-skills
      - name: Korner ve guc verisi
        run: |
          python3 - <<'PY'
          import json, subprocess
          def cli(*a, t=90):
              r = subprocess.run(["sports-skills", *a], capture_output=True, text=True, timeout=t)
              try: return json.loads(r.stdout)
              except Exception: return {"_hata": (r.stderr or r.stdout)[:200]}
          def g(b, d, n=1500):
              print("\n"+"="*8, b); print(json.dumps(d, ensure_ascii=False)[:n])
          g("strength FB(436) vs Konya(7648)", cli("football","get_team_strength","--team_id=436","--team_id_2=7648","--league_slug=super-lig"))
          g("forecast FB vs Konya", cli("football","get_match_forecast","--team_id=436","--team_id_2=7648","--league_slug=super-lig"))
          st = cli("football","get_event_statistics","--event_id=401888323")
          g("event_statistics (gecmis mac) — KORNER VAR MI", st, 2200)
          PY
